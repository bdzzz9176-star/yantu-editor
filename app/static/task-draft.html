<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研途编辑｜任务初稿</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="brand-mark">研</div><div><strong>研途编辑</strong><span>任务独立生成空间</span></div><a class="top-link" id="back-task" href="/tasks.html">返回任务</a><div class="local-badge">本地运行</div></header>
<main><section class="hero compact-hero"><div><p class="eyebrow">阶段4 · 当前学校独立输出</p><h1 id="page-title">生成正文与Word</h1><p class="hero-copy">初稿、修改记录、图表和Word均保存在当前任务目录，不会覆盖其他学校。</p></div><div class="status-card"><span>模型状态</span><strong id="model-status">读取中</strong><small id="task-status">等待操作</small></div></section>
<section class="panel" id="config-help" hidden><h2>需要重新配置模型</h2><p class="field-help">旧DPAPI密钥无法解密时，可直接在这里重新保存；不会影响本任务已经生成的数据、图表和Word。</p><div class="form-grid"><label><span>API地址</span><input id="base-url" value="https://api.deepseek.com"></label><label><span>模型ID</span><input id="model-id" value="deepseek-chat"></label><label class="full-field"><span>API密钥</span><input id="api-key" type="password" autocomplete="off"></label></div><label class="remember-option"><input id="remember-key" type="checkbox" checked>在这台电脑上安全记住密钥</label><button class="primary-wide spaced-button" id="save-config">保存并启用模型</button><p class="field-help" id="config-message"></p></section>
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">正文</p><h2>专属初稿</h2></div><span class="risk-tag" id="draft-badge">尚未生成</span></div><button class="primary-wide" id="generate-draft">调用DeepSeek生成初稿</button><p class="field-help" id="draft-message"></p><pre class="draft-preview" id="draft-content" hidden></pre><div id="evaluation" class="warning-list"></div></section>
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">按意见落实</p><h2>修改初稿</h2></div></div><textarea id="revision" placeholder="例如：重点分析通信工程；删除泛泛的学校介绍；结论写得更直接……"></textarea><button class="primary-wide spaced-button" id="revise">应用修改意见</button><p class="field-help" id="revision-message"></p></section>
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">版本追踪</p><h2>修改记录与历史文件</h2></div><span class="count-tag" id="version-count">0个版本</span></div><div id="version-list" class="material-list"></div><h3 class="subheading">Word历史版本</h3><div id="word-version-list" class="material-list"></div></section>
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">只生成有意义的图</p><h2>图表</h2></div><span class="count-tag" id="chart-count">0张</span></div><button class="primary-wide" id="generate-charts">生成／更新图表</button><p class="field-help" id="chart-message"></p><div class="charts-grid" id="charts"></div></section>
<section class="panel"><div class="panel-heading"><div><p class="eyebrow">最终交付</p><h2>Word初稿</h2></div><span class="risk-tag" id="word-badge">尚未生成</span></div><button class="primary-wide" id="generate-word">生成／更新Word</button><p class="field-help" id="word-message"></p><a class="download-link" id="download-word" hidden>下载当前Word</a></section>
</main><script src="/task-draft.js"></script></body></html>
